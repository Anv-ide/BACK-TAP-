name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate project files
        run: |
          mkdir -p ReelScroll && cd ReelScroll
          mkdir -p app
          cat > app/build.gradle.kts <<'EOF_RS'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.reelscroll"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.reelscroll"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
          }
          EOF_RS
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_RS'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:theme="@android:style/Theme.DeviceDefault.Light">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".ReelScrollService"
                      android:exported="true"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
              </application>
          </manifest>
          EOF_RS
          mkdir -p app/src/main/java/com/example/reelscroll
          cat > app/src/main/java/com/example/reelscroll/MainActivity.kt <<'EOF_RS'
          package com.example.reelscroll

          import android.app.Activity
          import android.content.ComponentName
          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView

          class MainActivity : Activity() {

              private lateinit var status: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val pad = (16 * resources.displayMetrics.density).toInt()
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(pad, pad, pad, pad)
                  }

                  status = TextView(this).apply { textSize = 18f }
                  root.addView(status)

                  root.addView(Button(this).apply {
                      text = "Open Accessibility settings"
                      setOnClickListener {
                          startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                      }
                  })

                  root.addView(Button(this).apply {
                      text = "Test: Next reel (swipe up)"
                      setOnClickListener { send(ReelScrollService.ACTION_NEXT) }
                  })

                  root.addView(Button(this).apply {
                      text = "Test: Previous reel (swipe down)"
                      setOnClickListener { send(ReelScrollService.ACTION_PREV) }
                  })

                  root.addView(TextView(this).apply {
                      textSize = 14f
                      setPadding(0, pad, 0, 0)
                      text = "Send these broadcast actions from Tasker or MacroDroid:\n\n" +
                          "${ReelScrollService.ACTION_NEXT}\n${ReelScrollService.ACTION_PREV}\n\n" +
                          "Tip: open a reels app, then trigger the test buttons from the " +
                          "notification shade or a delay timer, since this screen would " +
                          "otherwise be the one being swiped."
                  })

                  setContentView(root)
              }

              override fun onResume() {
                  super.onResume()
                  status.text = if (isServiceEnabled()) {
                      "Service is ON"
                  } else {
                      "Service is OFF - enable \"Reel Scroll\" in Accessibility settings"
                  }
              }

              private fun send(action: String) {
                  sendBroadcast(Intent(action).setPackage(packageName))
              }

              private fun isServiceEnabled(): Boolean {
                  val enabled = Settings.Secure.getString(
                      contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES
                  ) ?: return false
                  val me = ComponentName(this, ReelScrollService::class.java).flattenToString()
                  return enabled.split(':').any { it.equals(me, ignoreCase = true) }
              }
          }
          EOF_RS
          mkdir -p app/src/main/java/com/example/reelscroll
          cat > app/src/main/java/com/example/reelscroll/ReelScrollService.kt <<'EOF_RS'
          package com.example.reelscroll

          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.graphics.Path
          import android.view.accessibility.AccessibilityEvent
          import androidx.core.content.ContextCompat

          class ReelScrollService : AccessibilityService() {

              companion object {
                  const val ACTION_NEXT = "com.example.reelscroll.NEXT"
                  const val ACTION_PREV = "com.example.reelscroll.PREV"
              }

              private val receiver = object : BroadcastReceiver() {
                  override fun onReceive(context: Context?, intent: Intent?) {
                      when (intent?.action) {
                          ACTION_NEXT -> scrollReel(next = true)
                          ACTION_PREV -> scrollReel(next = false)
                      }
                  }
              }

              override fun onServiceConnected() {
                  val filter = IntentFilter().apply {
                      addAction(ACTION_NEXT)
                      addAction(ACTION_PREV)
                  }
                  ContextCompat.registerReceiver(
                      this, receiver, filter, ContextCompat.RECEIVER_EXPORTED
                  )
              }

              override fun onDestroy() {
                  try {
                      unregisterReceiver(receiver)
                  } catch (_: IllegalArgumentException) {
                  }
                  super.onDestroy()
              }

              private fun scrollReel(next: Boolean) {
                  val m = resources.displayMetrics
                  val x = m.widthPixels / 2f
                  val startY = m.heightPixels * if (next) 0.80f else 0.20f
                  val endY = m.heightPixels * if (next) 0.20f else 0.80f

                  val path = Path().apply {
                      moveTo(x, startY)
                      lineTo(x, endY)
                  }
                  val stroke = GestureDescription.StrokeDescription(path, 0, 150)
                  dispatchGesture(GestureDescription.Builder().addStroke(stroke).build(), null, null)
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}
              override fun onInterrupt() {}
          }
          EOF_RS
          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'EOF_RS'
          <resources>
              <string name="app_name">Reel Scroll</string>
              <string name="service_desc">Performs a swipe up or down when it receives a Next or Previous command from another app. Used only to scroll reels.</string>
          </resources>
          EOF_RS
          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/accessibility_service_config.xml <<'EOF_RS'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:canPerformGestures="true"
              android:description="@string/service_desc"
              android:notificationTimeout="100" />
          EOF_RS
          cat > build.gradle.kts <<'EOF_RS'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_RS
          cat > gradle.properties <<'EOF_RS'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF_RS
          mkdir -p gradle/wrapper
          cat > gradle/wrapper/gradle-wrapper.properties <<'EOF_RS'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF_RS
          cat > settings.gradle.kts <<'EOF_RS'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ReelScroll"
          include(":app")
          EOF_RS

      - name: Build debug APK
        working-directory: ReelScroll
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ReelScroll-apk
          path: ReelScroll/app/build/outputs/apk/debug/app-debug.apk
